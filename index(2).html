<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AR كرة فوق التارجت</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #fff;
    font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif; overflow: hidden; }
  #menu { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 14px; padding: 24px; text-align: center; }
  #menu h1 { margin: 0; font-size: 24px; }
  #menu p { margin: 0; max-width: 360px; line-height: 1.8; opacity: .85; }
  button, .btn { background: #2e7d32; color: #fff; border: 0; border-radius: 12px; padding: 14px 28px;
    font-size: 18px; cursor: pointer; text-decoration: none; display: inline-block; }
  .btn.alt { background: #37474f; font-size: 15px; padding: 10px 20px; }
  #stage { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; }
  #wrap { position: relative; }
  #video, #gl { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  #gl { pointer-events: none; }
  #status { position: fixed; top: 0; left: 0; right: 0; z-index: 10; padding: 12px 14px;
    padding-top: max(12px, env(safe-area-inset-top)); text-align: center; font-size: 16px;
    background: rgba(0,0,0,.55); display: none; }
  #status.err { background: rgba(170,0,0,.9); }
  #controls { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; display: none;
    padding: 12px 16px; padding-bottom: max(12px, env(safe-area-inset-bottom));
    background: rgba(0,0,0,.6); font-size: 14px; }
  #controls label { display: flex; align-items: center; gap: 10px; margin: 6px 0; }
  #controls label span { min-width: 90px; }
  #controls input[type=range] { flex: 1; direction: ltr; }
  #autoBtn { padding: 6px 14px; font-size: 14px; border-radius: 8px; background: #37474f; }
  #autoBtn.on { background: #2e7d32; }
  #markerPage { position: fixed; inset: 0; background: #fff; color: #000; display: none;
    flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 16px;
    overflow: auto; }
  #markerBox { background: #fff; padding: 24px; }
  #markerBox svg { width: min(75vmin, 600px); height: auto; display: block; }
</style>
</head>
<body>

<div id="menu">
  <h1>AR: كرة فوق التارجت</h1>
  <p>دوس على "تشغيل الكاميرا" وسلّط الكاميرا على التارجت. لما تلقطه هتظهر كرة فوقه وتمشي معاه.</p>
  <div id="preview" style="display:none">
    <div id="previewBox" style="background:#fff;padding:14px;border-radius:8px;width:min(46vmin,240px)"></div>
    <p style="margin-top:8px;font-size:14px">ده التارجت. اعرضه على موبايل أو اطبعه.</p>
    <button class="alt btn" id="pngBtn">تحميل الصورة PNG</button>
  </div>
  <button id="startBtn" disabled>جاري تحميل المكتبات...</button>
  <p id="menuMsg" style="color:#ffb4b4"></p>
</div>

<div id="stage">
  <div id="wrap">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="gl"></canvas>
  </div>
</div>
<div id="status"></div>

<div id="controls">
  <label><span>اتجاه الإضاءة</span>
    <input type="range" id="azSlider" min="0" max="360" value="45"></label>
  <label><span>ارتفاع الإضاءة</span>
    <input type="range" id="elSlider" min="15" max="85" value="50"></label>
  <label><span>تدوير تلقائي</span>
    <button id="autoBtn" type="button">شغّل</button></label>
</div>

<div id="markerPage">
  <div id="markerBox"></div>
  <div>اطبع الصورة دي أو اعرضها على شاشة تانية، وخلّي حواليها مساحة بيضا.</div>
  <div><button id="dlBtn">تحميل الصورة (SVG)</button></div>
</div>

<script>
// ================= إعدادات =================
const MARKER_ID  = 42;     // رقم التارجت (من 0 لـ 1022)
const MODEL_SIZE = 100;    // حجم التارجت بوحدات افتراضية
const RADIUS     = 32;     // نصف قطر الكرة (بنفس الوحدات)
const BALL_COLOR = 0xff5722;

// ---- الشخصية بتاعتك ----
const MODEL_URL    = 'character.glb';    // اسم ملف الموديل جنب الصفحة، مثلًا: 'character.glb' (سيبه فاضي لعرض الكرة)
const MODEL_HEIGHT = 80;    // طول الشخصية بنفس وحدات التارجت (التارجت = 100)
const MODEL_ROT_Z  = 0;     // لو الشخصية بتبص لاتجاه غلط، جرّب 90 أو 180 أو 270 (بالدرجات)
const ANIM_INDEX   = 0;     // رقم الأنيميشن اللي يشتغل (0 = الأول). الأسماء بتتكتب في Console
// ===========================================

const $ = (id) => document.getElementById(id);
const menuMsg = $('menuMsg'), statusEl = $('status');

function showStatus(text, isErr) {
  statusEl.style.display = 'block';
  statusEl.className = isErr ? 'err' : '';
  statusEl.textContent = text;
}

// تحميل سكريبت مع بدائل لو الرابط الأول فشل
function loadScript(bases, file) {
  return new Promise((resolve, reject) => {
    let i = 0;
    (function next() {
      if (i >= bases.length) return reject(new Error('تعذر تحميل ' + file));
      const s = document.createElement('script');
      s.src = bases[i++] + file;
      s.onload = resolve;
      s.onerror = () => { s.remove(); next(); };
      document.head.appendChild(s);
    })();
  });
}

async function loadLibs() {
  await loadScript([
    'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/',
    'https://cdn.jsdelivr.net/npm/three@0.128.0/build/'
  ], 'three.min.js');
  const aruco = [
    'https://cdn.jsdelivr.net/npm/js-aruco2@2.0.0/src/',
    'https://unpkg.com/js-aruco2@2.0.0/src/'
  ];
  for (const f of ['cv.js', 'aruco.js', 'svd.js', 'posit1.js']) await loadScript(aruco, f);
  if (MODEL_URL) {
    await loadScript([
      'https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/',
      'https://unpkg.com/three@0.128.0/examples/js/loaders/'
    ], 'GLTFLoader.js');
  }
  if (typeof THREE === 'undefined' || typeof AR === 'undefined' || typeof POS === 'undefined') {
    throw new Error('المكتبات اتحمّلت ناقصة');
  }
}

// ---------- صورة التارجت ----------
function getMarkerSVG() {
  const text = new AR.Dictionary('ARUCO').generateSVG(MARKER_ID);
  const doc = new DOMParser().parseFromString(text, 'image/svg+xml');
  const svg = doc.documentElement;
  if (!svg.getAttribute('viewBox')) {
    const w = parseFloat(svg.getAttribute('width')) || 100;
    const h = parseFloat(svg.getAttribute('height')) || 100;
    svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
  }
  svg.removeAttribute('width');
  svg.removeAttribute('height');
  svg.setAttribute('shape-rendering', 'crispEdges');
  return new XMLSerializer().serializeToString(svg);
}

function showMarkerPage() {
  $('menu').style.display = 'none';
  $('markerPage').style.display = 'flex';
  const svgStr = getMarkerSVG();
  $('markerBox').innerHTML = svgStr;
  $('dlBtn').onclick = () => {
    const blob = new Blob([svgStr], { type: 'image/svg+xml' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'target.svg';
    a.click();
  };
}

// ---------- الكاميرا والتتبع ----------
let renderer, scene, camera, anchor, ball, shadow, detector, posit, sun;
let dw = 640, dh = 480, lost = 999;
const SMOOTH = 0.65;   // كل ما قلّ الرقم الحركة أهدى (وأبطأ شوية). من 0.1 لـ 1
let mixer = null, clock = null, charLoaded = false;
let targetQ, targetP, tmpEuler;   // بتتعمل في setupThree بعد تحميل three.js
let sunAz = 45, sunEl = 50, autoSun = false;
const video = $('video');
const dCanvas = document.createElement('canvas');
const dCtx = dCanvas.getContext('2d', { willReadFrequently: true });

function fitStage() {
  const vw = video.videoWidth, vh = video.videoHeight;
  if (!vw) return;
  const s = Math.min(innerWidth / vw, innerHeight / vh);
  $('wrap').style.width = Math.round(vw * s) + 'px';
  $('wrap').style.height = Math.round(vh * s) + 'px';
}

function setupThree() {
  const gl = $('gl');
  renderer = new THREE.WebGLRenderer({ canvas: gl, alpha: true, antialias: true });
  renderer.setClearColor(0x000000, 0);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(video.videoWidth, video.videoHeight, false);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  targetQ = new THREE.Quaternion();
  targetP = new THREE.Vector3();
  tmpEuler = new THREE.Euler();

  scene = new THREE.Scene();
  // الكاميرا الافتراضية: البعد البؤري = عرض الصورة (نفس اللي بيستخدمه POSIT)
  const fov = 2 * Math.atan(dh / (2 * dw)) * 180 / Math.PI;
  camera = new THREE.PerspectiveCamera(fov, dw / dh, 1, 10000);

  scene.add(new THREE.AmbientLight(0xffffff, 0.55));

  anchor = new THREE.Object3D();
  anchor.visible = false;
  scene.add(anchor);

  ball = new THREE.Mesh(
    new THREE.SphereGeometry(RADIUS, 50, 50),
    new THREE.MeshStandardMaterial({ color: BALL_COLOR, roughness: 0.35, metalness: 0.1 })
  );
  ball.castShadow = true;
  anchor.add(ball);
  clock = new THREE.Clock();
  if (MODEL_URL) loadCharacter();

  // سطح شفاف بيستقبل الظل بس (على مستوى التارجت)
  shadow = new THREE.Mesh(
    new THREE.PlaneGeometry(MODEL_SIZE * 3, MODEL_SIZE * 3),
    new THREE.ShadowMaterial({ opacity: 0.5 })
  );
  shadow.position.z = 0.3;
  shadow.receiveShadow = true;
  anchor.add(shadow);

  // الشمس: جوه الـ anchor عشان تلف مع التارجت وتفضل ثابتة بالنسبة له
  sun = new THREE.DirectionalLight(0xffffff, 1.0);
  sun.castShadow = true;
  sun.shadow.mapSize.set(1024, 1024);
  const sc = sun.shadow.camera;
  sc.left = -MODEL_SIZE * 1.5; sc.right = MODEL_SIZE * 1.5;
  sc.top = MODEL_SIZE * 1.5;   sc.bottom = -MODEL_SIZE * 1.5;
  sc.near = 1; sc.far = MODEL_SIZE * 6;
  sun.shadow.radius = 4;
  anchor.add(sun);
  anchor.add(sun.target);   // الهدف (مركز التارجت)
  updateSun();

  // أشرطة التحكم
  const az = $('azSlider'), el = $('elSlider'), auto = $('autoBtn');
  az.oninput = () => { sunAz = +az.value; updateSun(); };
  el.oninput = () => { sunEl = +el.value; updateSun(); };
  auto.onclick = () => {
    autoSun = !autoSun;
    auto.classList.toggle('on', autoSun);
    auto.textContent = autoSun ? 'وقّف' : 'شغّل';
  };
  $('controls').style.display = 'block';
}

function loadCharacter() {
  showStatus('جاري تحميل الشخصية...');
  new THREE.GLTFLoader().load(MODEL_URL, (gltf) => {
    const model = gltf.scene;

    // نحسب الحجم ونظبطه: الطول = MODEL_HEIGHT، والقاعدة على التارجت، والمركز في النص
    const box = new THREE.Box3().setFromObject(model);
    const size = box.getSize(new THREE.Vector3());
    const center = box.getCenter(new THREE.Vector3());
    const s = MODEL_HEIGHT / (size.y || 1);
    model.scale.setScalar(s);
    model.position.set(-center.x * s, -box.min.y * s, -center.z * s);

    model.traverse((o) => {
      if (o.isMesh) {
        o.castShadow = true;
        o.frustumCulled = false;   // يمنع اختفاء الشخصية المتحركة فجأة
      }
    });

    // glTF بيعتبر Y لفوق، والتارجت عندنا Z لفوق: نلف 90 درجة
    const pivot = new THREE.Group();
    pivot.rotation.x = Math.PI / 2;
    const turn = new THREE.Group();
    turn.rotation.y = MODEL_ROT_Z * Math.PI / 180;
    turn.add(model);
    pivot.add(turn);
    anchor.add(pivot);

    anchor.remove(ball);   // نشيل الكرة

    // الأنيميشن
    if (gltf.animations && gltf.animations.length) {
      console.log('الأنيميشنز المتاحة:', gltf.animations.map((a, i) => i + ': ' + a.name));
      mixer = new THREE.AnimationMixer(model);
      const clip = gltf.animations[ANIM_INDEX] || gltf.animations[0];
      mixer.clipAction(clip).play();
    } else {
      console.log('الموديل مفيهوش أنيميشن.');
    }
    charLoaded = true;
    statusEl.style.display = 'none';
  }, undefined, (err) => {
    console.error(err);
    showStatus('تعذر تحميل الموديل "' + MODEL_URL + '". اتأكد إن الملف جنب index.html واسمه مكتوب صح.', true);
  });
}

// بتحط الشمس حوالين الموديل حسب الاتجاه (0-360) والارتفاع (15-85 درجة)
function updateSun() {
  const a = sunAz * Math.PI / 180, e = sunEl * Math.PI / 180, d = MODEL_SIZE * 3;
  sun.position.set(Math.cos(a) * Math.cos(e) * d, Math.sin(a) * Math.cos(e) * d, Math.sin(e) * d);
}

function tick(t) {
  requestAnimationFrame(tick);
  if (video.readyState < 2) return;

  dCtx.drawImage(video, 0, 0, dw, dh);
  const img = dCtx.getImageData(0, 0, dw, dh);
  const found = detector.detect(img).find((m) => m.id === MARKER_ID);

  if (found) {
    const corners = found.corners.map((c) => ({ x: c.x - dw / 2, y: dh / 2 - c.y }));
    const pose = posit.pose(corners);
    const R = pose.bestRotation, T = pose.bestTranslation;
    tmpEuler.set(
      -Math.asin(-R[1][2]),
      -Math.atan2(R[0][2], R[2][2]),
      Math.atan2(R[1][0], R[1][1]),
      'XYZ'
    );
    targetQ.setFromEuler(tmpEuler);
    targetP.set(T[0], T[1], -T[2]);
    if (!anchor.visible || lost > 8) {
      // أول لقطة: نروح للمكان مباشرة
      anchor.position.copy(targetP);
      anchor.quaternion.copy(targetQ);
    } else {
      // بعد كده: حركة ناعمة عشان الرعشة تقل
      anchor.position.lerp(targetP, SMOOTH);
      anchor.quaternion.slerp(targetQ, SMOOTH);
    }
    anchor.visible = true;
    lost = 0;
    statusEl.style.display = 'none';
  } else if (++lost > 8) {
    anchor.visible = false;
    if (statusEl.className !== 'err') showStatus('سلّط الكاميرا على التارجت');
  }

  // الكرة طايرة فوق التارجت وبتتحرك لفوق وتحت شوية
  if (!MODEL_URL) ball.position.z = RADIUS + 8 + Math.sin(t / 400) * 5;
  else if (!charLoaded) ball.position.z = RADIUS;   // الكرة مؤقتًا لحد ما الشخصية تتحمّل
  if (mixer) mixer.update(clock.getDelta());
  if (autoSun) {
    sunAz = (sunAz + 0.8) % 360;
    $('azSlider').value = sunAz;
    updateSun();
  }
  renderer.render(scene, camera);
}

async function startCamera() {
  $('startBtn').disabled = true;
  menuMsg.textContent = '';
  try {
    if (!window.isSecureContext) throw { name: 'Insecure' };
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw { name: 'Unsupported' };

    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: false
    });
    video.srcObject = stream;
    await video.play();
    await new Promise((r) => (video.videoWidth ? r() : (video.onloadedmetadata = r)));

    dw = 640;   // دقة أعلى = تتبع أثبت (لو الجهاز بطيء رجّعها 480)
    dh = Math.round(dw * video.videoHeight / video.videoWidth);
    dCanvas.width = dw; dCanvas.height = dh;

    detector = new AR.Detector({ dictionaryName: 'ARUCO' });
    posit = new POS.Posit(MODEL_SIZE, dw);

    $('menu').style.display = 'none';
    $('stage').style.display = 'flex';
    fitStage();
    addEventListener('resize', fitStage);
    setupThree();
    showStatus('سلّط الكاميرا على التارجت');
    requestAnimationFrame(tick);
  } catch (e) {
    const map = {
      NotAllowedError: 'إذن الكاميرا متمنع. اضغط على أيقونة الكاميرا في شريط العنوان واختار Allow ثم اعمل Refresh.',
      NotFoundError: 'مفيش كاميرا متعرّف عليها في الجهاز.',
      NotReadableError: 'الكاميرا مشغولة في برنامج تاني (Zoom/Teams/Camera). اقفله وجرّب تاني.',
      OverconstrainedError: 'إعدادات الكاميرا مش مدعومة.',
      Insecure: 'الصفحة لازم تتفتح من localhost أو 127.0.0.1 أو HTTPS (مش من IP عادي).',
      Unsupported: 'المتصفح ده مش بيدعم الكاميرا. استخدم Chrome أو Edge.'
    };
    menuMsg.textContent = map[e.name] || ('حصل خطأ: ' + (e.message || e.name || e));
    $('startBtn').disabled = false;
    $('startBtn').textContent = 'جرّب تاني';
  }
}

// ---------- التشغيل ----------
(async function main() {
  try {
    await loadLibs();
  } catch (e) {
    menuMsg.textContent = 'فشل تحميل المكتبات: اتأكد من النت وجرّب Refresh. (' + e.message + ')';
    $('startBtn').textContent = 'المكتبات مش اتحمّلت';
    return;
  }
  if (new URLSearchParams(location.search).has('marker')) { showMarkerPage(); return; }

  // عرض صورة التارجت في القايمة + تحميل PNG
  try {
    const svgStr = getMarkerSVG();
    $('previewBox').innerHTML = svgStr;
    $('previewBox').querySelector('svg').style.cssText = 'width:100%;height:auto;display:block';
    $('preview').style.display = 'block';
    $('pngBtn').onclick = () => {
      const sized = svgStr.replace('<svg', '<svg width="640" height="640"');
      const url = URL.createObjectURL(new Blob([sized], { type: 'image/svg+xml' }));
      const img = new Image();
      img.onload = () => {
        const c = document.createElement('canvas');
        c.width = c.height = 800;
        const x = c.getContext('2d');
        x.fillStyle = '#fff'; x.fillRect(0, 0, 800, 800);
        x.imageSmoothingEnabled = false;
        x.drawImage(img, 80, 80, 640, 640);
        c.toBlob((b) => {
          const a = document.createElement('a');
          a.href = URL.createObjectURL(b);
          a.download = 'target.png';
          a.click();
        });
      };
      img.src = url;
    };
  } catch (e) {
    menuMsg.textContent = 'تعذر توليد صورة التارجت: ' + (e.message || e);
  }

  $('startBtn').textContent = 'تشغيل الكاميرا';
  $('startBtn').disabled = false;
  $('startBtn').onclick = startCamera;
})();
</script>
</body>
</html>
